# Committed on purpose: contains no secrets. Auth relies on Databricks PAT or Service Principal credentials.
dlight_callcentre_analytics:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      # Local iteration only. Validate here before pushing; never touched by CI/CD.
      # Defaults to the dev_ schema unless overridden.
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'dlight_analytics') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'dev_dlight_analytics') }}"
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4

    prod:
      # Deliberately CI/CD-only: invoked from deploy_prod in GitHub Actions.
      # Writes to the unmarked production schema (dlight_analytics).
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'main') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'dlight_analytics') }}"
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4