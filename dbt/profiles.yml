# Committed on purpose: contains no secrets. Auth is either ambient gcloud
# ADC + service-account impersonation (dev) or Workload Identity Federation
# (prod, from CI/CD only) -- see .env.example.
dlight_callcentre_analytics:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      # Local iteration only. Model, run dbt build/dbt run, and validate
      # here before pushing -- this target is never touched by CI/CD.
      # dev_ prefixed on purpose: prod is the plain, unmarked name below,
      # so the unset-env-var default has to point at dev, not prod -- see
      # get_analytics_dataset()/get_raw_dataset() in ingestion/common.py
      # for the same rule applied to the raw dataset.
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_ANALYTICS_DATASET', 'dev_dlight_analytics') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      impersonate_service_account: "{{ env_var('BQ_IMPERSONATE_SERVICE_ACCOUNT', '') }}"
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
    prod:
      # Deliberately CI/CD-only: this target is only ever invoked from the
      # deploy_prod job in .github/workflows/ci.yml (gated to pushes on
      # main, after lint + unit tests pass). Nothing in this repo or its
      # docs tells a human to set DBT_TARGET=prod locally -- see README's
      # Environments section. Auth is Workload Identity Federation:
      # google-github-actions/auth@v2 writes an "external account"
      # credential config to GOOGLE_APPLICATION_CREDENTIALS, not a legacy
      # service-account JSON key -- `oauth` (ADC-style loading via
      # google.auth.default()) understands both; `service-account`/
      # `keyfile` only understands the legacy kind.
      #
      # The plain, unmarked dataset name (dlight_analytics, not
      # dlight_analytics_prod) is deliberate: it's the ready-for-use
      # dataset a BI tool or analyst would query, so it gets the name with
      # no caveat attached, and dev carries the dev_ marker instead of the
      # other way around. This only works because get_*_dataset()'s
      # defaults point at dev, not this -- deploy_prod is the one place
      # that explicitly overrides both env vars to reach here.
      #
      # Known limit: dev and prod currently share one service account
      # (scoped to this case study only). A real rollout would give prod
      # its own, more narrowly-scoped SA and grant analysts read-only
      # access to just the prod marts dataset -- enforcing the boundary at
      # the IAM layer too, not only by which workflow runs.
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_ANALYTICS_DATASET', 'dlight_analytics') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
