version: 2

sources:
  - name: dlight_raw
    catalog: "{{ target.catalog }}"
    schema: "{{ target.schema }}"
    description: >
      Append-only landing tables loaded directly into Databricks / ADLS Gen2.
      Every business column is STRING with no casting, trimming, or
      deduplication applied at ingestion.
    tables:
      - name: ameyo_calls
        description: One row per physical CSV row from every distinct Outbound Calls Ameyo.csv ever loaded.
      - name: atlas_dispositions
        description: One row per physical CSV row from every distinct Calls Dispositions Atlas.csv ever loaded.
      - name: payments
        description: One row per physical CSV row from every distinct Payments Data Atlas.csv ever loaded.
      - name: agent_mapping
        description: One row per physical CSV row from every distinct Atlas Ameyo Mapping.csv ever loaded.
      - name: fx_rates
        description: Daily USD exchange rates fetched by ingestion/api/fx/, keyed on (rate_date, currency).